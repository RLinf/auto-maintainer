[project]
name = "auto-maintainer"
version = "0.1.0"
description = "A service that helps maintainers run GitHub repositories with coding agents."
readme = "AGENTS.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "croniter>=2.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
am = "auto_maintainer.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_maintainer"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "auto_maintainer/_data/config"
"packs" = "auto_maintainer/_data/packs"
"skills" = "auto_maintainer/_data/skills"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["ui"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF013", "CPY001"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)Copyright \\d{4} The RLinf Authors"

[tool.ruff.lint.per-file-ignores]
"src/auto_maintainer/store/migrations/versions/*" = ["CPY001"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live_agent and not live'"
markers = [
    "live_agent: runs installed agent CLIs (costs money, needs auth)",
    "live: talks to the real GitHub API",
]
