# Maintenance schedules (cron, UTC). Operators may override these in the memory repo.
reconcile:  "*/30 * * * *"
review_scan: "*/15 * * * *"   # each repository decides with review.scan.schedule
comment_check: "*/15 * * * *" # each repository decides with review.comments.schedule
stale:      "0 1 * * *"
drift:      "15 * * * *"
doctor:     "30 2 * * *"
memory_sync: "*/5 * * * *"
disk_cleanup: "45 4 * * *"   # old run folders, idle checkouts, agent CLIs' old sessions
learn:      "0 3 * * *"
