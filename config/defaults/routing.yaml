# Default agent route per task kind. A profile's routing section overrides it.
# Each route ends with every built-in CLI, so a host with any one of them
# installed can run every task; the router skips CLIs that are not installed.
triage:       {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], effort: low, timeout_seconds: 600}
review:       {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], verifier: codex, timeout_seconds: 3600}
verify:       {primary: codex, fallback: [claude-code, antigravity, opencode, gemini], timeout_seconds: 1800}
followup:     {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], timeout_seconds: 2400}
evaluate:     {primary: antigravity, fallback: [claude-code, codex, opencode, gemini], effort: low, timeout_seconds: 600}
calibrate:    {primary: antigravity, fallback: [claude-code, codex, opencode, gemini], timeout_seconds: 900}
ci_diagnose:  {primary: codex, fallback: [claude-code, antigravity, opencode, gemini], timeout_seconds: 1200}
ci_root_cause: {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], timeout_seconds: 1800}
hygiene:      {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], effort: low, timeout_seconds: 600}
governance:   {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], timeout_seconds: 1800}
onboard:      {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], timeout_seconds: 2400}
learn:        {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], timeout_seconds: 1200}
chat:         {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], timeout_seconds: 900}
self_improve: {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], timeout_seconds: 3600}
fix:          {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], timeout_seconds: 2400}
reproduce:    {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], timeout_seconds: 1800}
translate:    {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], effort: low, timeout_seconds: 600}
comment_check: {primary: claude-code, fallback: [codex, antigravity, opencode, gemini], effort: low, timeout_seconds: 600}
