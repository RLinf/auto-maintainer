repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.3"
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/commit-check/commit-check
    rev: "v0.10.2"
    hooks:
      - id: check-message
      - id: check-commit-signoff
